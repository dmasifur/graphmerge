[project]
name = "graphmerge"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-identity>=1.25.3",
    "jinja2>=3.1.6",
    "mammoth>=1.12.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.5",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["mammoth", "streamlit", "streamlit.*"]
ignore_missing_imports = true
